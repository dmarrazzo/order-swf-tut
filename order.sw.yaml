id: order
version: "1.0"
specVersion: "0.8"
name: Order Workflow
description: Order Workflow Sample
functions:
- name: 'checkAvailability'
  operation: 'specs/inventory.yaml#checkAvailability'
  type: rest
- name: printMessage
  type: custom
  operation: sysout
- name: sendOrder
  operation: specs/supplier.yaml#sendOrder
  type: rest
- name: cancelOrder
  operation: specs/supplier.yaml#cancelOrder
  type: rest
start: Check Inventory
states:
- name: Check Inventory
  type: operation
  actions:
  - name: printAction
    functionRef:
      refName: checkAvailability
      arguments:
        item-id: .item
    actionDataFilter:
      results: '.'
      toStateData: .available
  transition: Item Available?
- name: Item Available?
  type: switch
  dataConditions:
  - condition: '.available'
    transition: Prepare for Shipping
  defaultCondition:
    transition: Forward to External Supplier
- name: 'Prepare for Shipping'
  type: operation
  actions:
  - name: printAction
    functionRef:
      refName: printMessage
      arguments:
        message: Prepare for Shipping
  end: true
- name: 'Forward to External Supplier'
  type: operation
  actions:
  - name: sendOrder
    functionRef:
      refName: sendOrder
      arguments:
        supplier-id: sup-01
        content: '.orderId'
  end: true
